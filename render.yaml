# Render Infrastructure Blueprint Configuration
# Reference: https://render.com/docs/blueprint-spec
version: "1"

services:
  # 🌲 GeoTree Production Web Service (FastAPI Backend + React GIS Frontend)
  - type: web
    name: geotree-platform
    runtime: docker
    env: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/regions
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: "/app"
      - key: ENVIRONMENT
        value: "production"

