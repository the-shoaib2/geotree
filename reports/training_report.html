<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Model Training Metrics Report</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 40px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #30363d;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }
        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #21262d;
        }
        th {
            background-color: #21262d;
            color: #2ea44f;
        }
    </style>
</head>
<body>

</html>
